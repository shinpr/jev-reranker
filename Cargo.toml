[package]
name = "jev-reranker"
version = "0.1.4"
edition = "2021"
publish = false
description = "Rerank JSON search results with TypeSafe AI's Jev"
repository = "https://github.com/shinpr/jev-reranker"
homepage = "https://github.com/shinpr/jev-reranker"
readme = "README.md"
license = "MIT"
keywords = ["search", "reranking", "cli", "jev", "json"]
categories = ["command-line-utilities"]

[package.metadata.npm]
name = "jev-reranker"
prefix = "@shinpr/jev-reranker-"
bins = ["jev-reranker"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
custom = { publishConfig = { access = "public" } }

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
thiserror = "2.0.18"
unicode-segmentation = "=1.13.3"

[lints.rust]
unsafe_code = { level = "forbid", priority = 1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
float_cmp = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Reason: private modules group related domain types and functions.
module_name_repetitions = { level = "allow", priority = -1 }
# Reason: this binary crate does not expose a public library API.
must_use_candidate = { level = "allow", priority = -1 }
# Reason: private implementation functions have local error context.
missing_errors_doc = { level = "allow", priority = -1 }
# Reason: production code denies implicit panic paths.
missing_panics_doc = { level = "allow", priority = -1 }
# Reason: the binary's private modules use ordinary operator-facing prose.
doc_markdown = { level = "allow", priority = -1 }
