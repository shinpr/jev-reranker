name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.1
          target: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.target }}
          path: |
            target/*/release/jev-reranker
            target/*/release/jev-reranker.exe
          if-no-files-found: error

  package:
    name: Package npm release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: target/
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check release version
        shell: bash
        run: |
          package_id="$(cargo pkgid)"
          package_version="${package_id##*#}"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${package_version}" >&2
            exit 1
          fi

      - name: Generate npm packages
        run: npx --yes cargo-npm@0.1.4 npm generate --infer-targets --out-dir target/npm

      - name: Validate npm packages
        shell: bash
        run: |
          package_id="$(cargo pkgid)"
          package_version="${package_id##*#}"
          node scripts/validate-npm-packages.mjs target/npm "${package_version}"

      - name: Create npm package bundle
        shell: bash
        run: tar -czf "jev-reranker-${GITHUB_REF_NAME}-npm-packages.tar.gz" -C target npm

      - name: Attest npm package bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: jev-reranker-${{ github.ref_name }}-npm-packages.tar.gz

      - name: Attach npm package bundle to release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "jev-reranker-${GITHUB_REF_NAME}-npm-packages.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
