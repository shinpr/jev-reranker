name: CI

on:
  push:
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install pinned Cargo quality tools
        run: |
          cargo +1.98.1 install --locked cargo-deny --version 0.20.2
          cargo +1.98.1 install --locked cargo-machete --version 0.9.2

      - name: Run offline quality gate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo build --release
          cargo deny check
          cargo machete

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.1
          target: x86_64-unknown-linux-musl

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Linux package binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Generate npm packages
        run: |
          npx --yes cargo-npm@0.1.4 npm generate \
            --clean \
            --target x86_64-unknown-linux-musl \
            --out-dir target/npm

      - name: Install and run the packed CLI
        run: |
          mkdir -p target/npm-tarballs target/npm-smoke target/npm-cache
          npm_config_cache=target/npm-cache npm pack \
            target/npm/@shinpr/jev-reranker-linux-x64 \
            --pack-destination target/npm-tarballs
          npm_config_cache=target/npm-cache npm pack \
            target/npm/jev-reranker \
            --pack-destination target/npm-tarballs
          npm_config_cache=target/npm-cache npm install \
            --offline \
            --ignore-scripts \
            --prefix target/npm-smoke \
            target/npm-tarballs/*.tgz
          printf '%s\n' '[]' \
            | env -u TYPESAFE_API_KEY \
                target/npm-smoke/node_modules/.bin/jev-reranker --query test
