[advisories]
version = 2

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  # rustls-platform-verifier's Android JNI macros require syn 2 while the
  # remaining derive macros use syn 3.
  { name = "syn", version = "=2.0.119" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
exceptions = [
  # serde_json's preserve_order feature requires this Zlib-licensed crate.
  { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
